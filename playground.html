<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground — core libs</title>
    <meta name="theme-color" content="#141414" />
    <meta name="robots" content="noindex" />
    <link rel="preload" href="/fonts/inter-tight-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <style>
      /* dev-only page, styles kept local */
      .pg {
        position: fixed;
        inset: 0;
        padding: var(--ui-top) var(--gutter);
        overflow: auto;
        user-select: text;
      }
      .pg-label {
        margin-bottom: 12px;
        color: var(--muted);
      }
      .pg-counter {
        position: fixed;
        top: var(--ui-top);
        right: 39px;
      }
      .pg-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6vw;
        margin-top: 12vh;
      }
      .pg-summary {
        width: 21.875vw;
        max-width: 420px;
        min-width: 240px;
        margin-top: 21px;
      }
      .pg-about {
        font-size: 2.8125vw;
        line-height: 3.6458vw;
        letter-spacing: -0.02em;
      }
      .pg-controls {
        position: fixed;
        left: 50%;
        bottom: var(--ui-bottom);
        display: flex;
        gap: 22px;
        transform: translateX(-50%);
      }
      .pg-controls button {
        opacity: 0.5;
        transition: opacity var(--d-hover) var(--o2);
      }
      .pg-controls button:hover {
        opacity: 1;
      }
      @media (max-width: 767px) {
        .pg-grid { grid-template-columns: 1fr; }
        .pg-about { font-size: 24px; line-height: 30px; }
      }
    </style>
  </head>
  <body>
    <div class="pg">
      <p class="pg-label t-ui">Phase 2 playground — masked reveal, splitLines, counter</p>

      <div class="pg-grid">
        <section>
          <p class="pg-label t-ui">Fixed lines (heroTitle)</p>
          <h1 class="t-xl t-h1" id="hero"></h1>
          <p class="t-ui" style="margin-top: 10vh" id="role"></p>
          <p class="t-body pg-summary" id="summary"></p>
        </section>

        <section>
          <p class="pg-label t-ui">Auto-split paragraph — resize the window</p>
          <p class="pg-about" id="about"></p>
        </section>
      </div>
    </div>

    <div class="pg-counter" id="counter"></div>

    <nav class="pg-controls t-ui" aria-label="Playground controls">
      <button type="button" data-action="replay">Replay</button>
      <button type="button" data-action="out">Out</button>
      <button type="button" data-action="prev">Prev</button>
      <button type="button" data-action="next">Next</button>
    </nav>

    <script type="module" src="/src/dev/playground.js"></script>
  </body>
</html>
